<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyBook - Flight Booking</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #0b5ed7;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 26px;
        }

        header span {
            font-size: 14px;
        }

        .hero {
            background: linear-gradient(135deg, #0b5ed7, #4dabf7);
            padding: 50px 8% 90px;
            color: white;
        }

        .hero h2 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 17px;
        }

        .booking-box {
            background: white;
            color: #222;
            max-width: 1100px;
            margin: -50px auto 30px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        .trip-type {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .trip-type label {
            cursor: pointer;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            width: 100%;
        }

        .search-btn {
            margin-top: 20px;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #0b5ed7;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .search-btn:hover {
            background: #084298;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        .section-title {
            margin: 25px 0 15px;
        }

        .flight-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            align-items: center;
            gap: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .airline {
            font-weight: bold;
            font-size: 17px;
        }

        .time {
            font-size: 20px;
            font-weight: bold;
        }

        .duration {
            color: #777;
            font-size: 13px;
            margin-top: 5px;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            color: #0b5ed7;
        }

        .select-btn {
            background: #198754;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 7px;
            cursor: pointer;
        }

        .select-btn:hover {
            background: #146c43;
        }

        .hidden {
            display: none;
        }

        .booking-form {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .booking-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .seat-container {
            display: grid;
            grid-template-columns: repeat(6, 45px);
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }

        .seat {
            height: 42px;
            border: none;
            border-radius: 7px;
            background: #dbeafe;
            cursor: pointer;
            font-weight: bold;
        }

        .seat:hover {
            background: #93c5fd;
        }

        .seat.selected {
            background: #198754;
            color: white;
        }

        .seat.booked {
            background: #777;
            color: white;
            cursor: not-allowed;
        }

        .summary {
            background: #eef5ff;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .confirm-btn {
            margin-top: 20px;
            padding: 14px 25px;
            background: #0b5ed7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .success {
            background: #d1e7dd;
            color: #0f5132;
            padding: 25px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .error {
            color: #dc3545;
            margin-top: 10px;
        }

        footer {
            margin-top: 50px;
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 800px) {

            .form-grid {
                grid-template-columns: 1fr 1fr;
            }

            .flight-card {
                grid-template-columns: 1fr 1fr;
            }

            .booking-form-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 500px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .flight-card {
                grid-template-columns: 1fr;
            }

            .hero h2 {
                font-size: 28px;
            }

            .seat-container {
                grid-template-columns: repeat(6, 38px);
                gap: 6px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>✈ SkyBook</h1>
    <span>Simple Flight Booking</span>
</header>

<section class="hero">
    <h2>Where would you like to fly?</h2>
    <p>Search flights, choose your seat and complete your booking.</p>
</section>

<!-- SEARCH BOX -->
<div class="booking-box">

    <div class="trip-type">
        <label>
            <input type="radio" name="trip" value="oneway" checked>
            One Way
        </label>

        <label>
            <input type="radio" name="trip" value="roundtrip">
            Round Trip
        </label>
    </div>

    <form id="searchForm">

        <div class="form-grid">

            <div class="form-group">
                <label>From</label>
                <select id="from" required>
                    <option value="">Select airport</option>
                    <option value="HYD">Hyderabad (HYD)</option>
                    <option value="DEL">Delhi (DEL)</option>
                    <option value="BOM">Mumbai (BOM)</option>
                    <option value="BLR">Bangalore (BLR)</option>
                    <option value="MAA">Chennai (MAA)</option>
                </select>
            </div>

            <div class="form-group">
                <label>To</label>
                <select id="to" required>
                    <option value="">Select airport</option>
                    <option value="HYD">Hyderabad (HYD)</option>
                    <option value="DEL">Delhi (DEL)</option>
                    <option value="BOM">Mumbai (BOM)</option>
                    <option value="BLR">Bangalore (BLR)</option>
                    <option value="MAA">Chennai (MAA)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Departure</label>
                <input type="date" id="departure" required>
            </div>

            <div class="form-group">
                <label>Return</label>
                <input type="date" id="returnDate">
            </div>

            <div class="form-group">
                <label>Passengers</label>
                <select id="passengers">
                    <option value="1">1 Passenger</option>
                    <option value="2">2 Passengers</option>
                    <option value="3">3 Passengers</option>
                    <option value="4">4 Passengers</option>
                    <option value="5">5 Passengers</option>
                </select>
            </div>

            <div class="form-group">
                <label>Class</label>
                <select id="class">
                    <option value="economy">Economy</option>
                    <option value="premium">Premium Economy</option>
                    <option value="business">Business</option>
                </select>
            </div>

        </div>

        <button class="search-btn" type="submit">
            🔍 Search Flights
        </button>

        <div id="searchError" class="error"></div>

    </form>
</div>


<!-- FLIGHT RESULTS -->
<div class="container">

    <section id="results" class="hidden">

        <h2 class="section-title">Available Flights</h2>

        <div id="flightList"></div>

    </section>


    <!-- PASSENGER SECTION -->
    <section id="passengerSection" class="hidden">

        <h2 class="section-title">Passenger Details</h2>

        <div class="booking-form">

            <div class="booking-form-grid">

                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="firstName" placeholder="Enter first name">
                </div>

                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="lastName" placeholder="Enter last name">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="example@gmail.com">
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" id="phone" placeholder="10 digit mobile number">
                </div>

            </div>

            <h3 style="margin-top:25px;">Choose Your Seat</h3>

            <div class="seat-container" id="seatContainer"></div>

            <div class="summary">

                <h3>Booking Summary</h3>

                <p id="summaryFlight">Flight: -</p>
                <p id="summaryPassenger">Passenger: -</p>
                <p id="summarySeat">Seat: Not selected</p>
                <p id="summaryClass">Class: -</p>

                <hr style="margin:15px 0;">

                <h2 id="totalPrice">Total: ₹0</h2>

            </div>

            <button class="confirm-btn" id="confirmBtn">
                Confirm Booking
            </button>

            <div id="bookingMessage"></div>

        </div>

    </section>

</div>


<footer>
    <p>© 2026 SkyBook Flight Booking</p>
</footer>


<script>

    const searchForm = document.getElementById("searchForm");
    const results = document.getElementById("results");
    const flightList = document.getElementById("flightList");

    const passengerSection =
        document.getElementById("passengerSection");

    const searchError =
        document.getElementById("searchError");

    const from = document.getElementById("from");
    const to = document.getElementById("to");
    const departure = document.getElementById("departure");
    const returnDate = document.getElementById("returnDate");

    const passengers =
        document.getElementById("passengers");

    const travelClass =
        document.getElementById("class");

    let selectedFlight = null;
    let selectedSeat = null;


    // Set today's date as minimum date
    const today = new Date().toISOString().split("T")[0];

    departure.min = today;
    returnDate.min = today;


    // Round trip handling
    document.querySelectorAll('input[name="trip"]').forEach(radio => {

        radio.addEventListener("change", function () {

            if (this.value === "roundtrip") {
                returnDate.required = true;
                returnDate.disabled = false;
            } else {
                returnDate.required = false;
                returnDate.disabled = true;
                returnDate.value = "";
            }

        });

    });


    // Search flights
    searchForm.addEventListener("submit", function(event) {

        event.preventDefault();

        searchError.textContent = "";

        if (from.value === to.value) {

            searchError.textContent =
                "Departure and destination airports cannot be the same.";

            return;
        }

        if (returnDate.value &&
            returnDate.value < departure.value) {

            searchError.textContent =
                "Return date cannot be before departure date.";

            return;
        }


        generateFlights();

    });


    function generateFlights() {

        const basePrice = {
            HYD: 4500,
            DEL: 4000,
            BOM: 4200,
            BLR: 3500,
            MAA: 3800
        };

        const prices = [
            basePrice[to.value] || 4000,
            (basePrice[to.value] || 4000) + 700,
            (basePrice[to.value] || 4000) + 1200
        ];


        const flights = [

            {
                airline: "IndiGo",
                number: "6E 203",
                departure: "06:30",
                arrival: "08:45",
                duration: "2h 15m",
                price: prices[0]
            },

            {
                airline: "Air India",
                number: "AI 547",
                departure: "10:15",
                arrival: "12:35",
                duration: "2h 20m",
                price: prices[1]
            },

            {
                airline: "Vistara",
                number: "UK 821",
                departure: "17:30",
                arrival: "19:50",
                duration: "2h 20m",
                price: prices[2]
            }

        ];


        flightList.innerHTML = "";

        flights.forEach((flight, index) => {

            const card = document.createElement("div");

            card.className = "flight-card";

            card.innerHTML = `

                <div>
                    <div class="airline">
                        ✈ ${flight.airline}
                    </div>

                    <div>${flight.number}</div>
                </div>

                <div>
                    <div class="time">
                        ${flight.departure} → ${flight.arrival}
                    </div>

                    <div class="duration">
                        ${flight.duration}
                    </div>
                </div>

                <div>
                    <div class="price">
                        ₹${flight.price.toLocaleString()}
                    </div>

                    <div class="duration">
                        per passenger
                    </div>
                </div>

                <button class="select-btn"
                        onclick="selectFlight(${index})">
                    Select
                </button>
            `;

            flightList.appendChild(card);

        });

        window.availableFlights = flights;

        results.classList.remove("hidden");

        passengerSection.classList.add("hidden");

        results.scrollIntoView({
            behavior: "smooth"
        });

    }


    function selectFlight(index) {

        selectedFlight = window.availableFlights[index];

        createSeats();

        passengerSection.classList.remove("hidden");

        updateSummary();

        passengerSection.scrollIntoView({
            behavior: "smooth"
        });

    }


    function createSeats() {

        const container =
            document.getElementById("seatContainer");

        container.innerHTML = "";

        selectedSeat = null;


        const bookedSeats = [3, 8, 15, 22];


        for (let i = 1; i <= 30; i++) {

            const button =
                document.createElement("button");

            button.type = "button";

            button.className = "seat";

            button.textContent =
                String(i);

            if (bookedSeats.includes(i)) {

                button.classList.add("booked");

                button.disabled = true;

            } else {

                button.addEventListener("click", function() {

                    document
                        .querySelectorAll(".seat.selected")
                        .forEach(seat => {
                            seat.classList.remove("selected");
                        });

                    this.classList.add("selected");

                    selectedSeat = i;

                    updateSummary();

                });

            }

            container.appendChild(button);

        }

    }


    function updateSummary() {

        if (!selectedFlight) return;


        const passengerCount =
            Number(passengers.value);

        let multiplier = 1;

        if (travelClass.value === "premium") {
            multiplier = 1.5;
        }

        if (travelClass.value === "business") {
            multiplier = 2.5;
        }


        const total =
            selectedFlight.price *
            passengerCount *
            multiplier;


        document.getElementById("summaryFlight").textContent =
            `Flight: ${selectedFlight.airline} ${selectedFlight.number}
             (${selectedFlight.departure} → ${selectedFlight.arrival})`;


        document.getElementById("summaryPassenger").textContent =
            `Passengers: ${passengerCount}`;


        document.getElementById("summarySeat").textContent =
            `Seat: ${selectedSeat || "Not selected"}`;


        document.getElementById("summaryClass").textContent =
            `Class: ${travelClass.options[travelClass.selectedIndex].text}`;


        document.getElementById("totalPrice").textContent =
            `Total: ₹${Math.round(total).toLocaleString()}`;

    }


    passengers.addEventListener("change", updateSummary);

    travelClass.addEventListener("change", updateSummary);


    // Confirm booking
    document.getElementById("confirmBtn")
        .addEventListener("click", function() {

            const firstName =
                document.getElementById("firstName").value.trim();

            const lastName =
                document.getElementById("lastName").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const phone =
                document.getElementById("phone").value.trim();


            if (!firstName ||
                !lastName ||
                !email ||
                !phone) {

                alert("Please fill in all passenger details.");

                return;
            }


            if (!selectedSeat) {

                alert("Please select a seat.");

                return;
            }


            const bookingId =
                "SB" +
                Math.floor(100000 + Math.random() * 900000);


            document.getElementById("bookingMessage")
                .innerHTML = `

                <div class="success">

                    <h2>🎉 Booking Confirmed!</h2>

                    <br>

                    <p>
                        <strong>Booking ID:</strong>
                        ${bookingId}
                    </p>

                    <p>
                        <strong>Passenger:</strong>
                        ${firstName} ${lastName}
                    </p>

                    <p>
                        <strong>Flight:</strong>
                        ${selectedFlight.airline}
                        ${selectedFlight.number}
                    </p>

                    <p>
                        <strong>Seat:</strong>
                        ${selectedSeat}
                    </p>

                    <p>
                        <strong>Email:</strong>
                        ${email}
                    </p>

                    <br>

                    <p>
                        Your booking has been successfully created.
                    </p>

                </div>
            `;

            document.getElementById("bookingMessage")
                .scrollIntoView({
                    behavior: "smooth"
                });

        });

</script>

</body>
</html>
